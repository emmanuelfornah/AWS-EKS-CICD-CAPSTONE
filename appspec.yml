version: 0.0
os: linux

# Whole deployment bundle (repo checkout + the image_tag.txt the
# BuildImage buildspec writes) lands at this path so the hooks below
# have somewhere fixed to read from, regardless of lifecycle stage.
files:
  - source: /
    destination: /opt/appointments

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 30
  AfterInstall:
    - location: scripts/start_container.sh
      timeout: 90
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
