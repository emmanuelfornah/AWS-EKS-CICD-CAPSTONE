apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointments-deployment
  labels:
    app: appointments-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointments-deployment
  template:
    metadata:
      labels:
        app: appointments-deployment
    spec:
      serviceAccountName: appointments-sa
      containers:
      - name: webserver
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/containers-image-repository:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8088
        env:
        - name: AWS_DEFAULT_REGION
          value: "<AWS_REGION>"  # Fixed: was set to 'wrongregion' causing STS endpoint failure
        - name: DATABASE_HOST
          value: "<RDS_ENDPOINT>"
        - name: DATABASE_USER
          value: "appointments_web"
        - name: DATABASE_DB_NAME
          value: "django_appointments"
